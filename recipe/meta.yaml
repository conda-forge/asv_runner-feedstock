{% set name = "asv_runner" %}
{% set version = "0.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # PyPI 0.2.5 ships wheel-only; GitHub tag has the sdist-equivalent tree for pdm-backend.
  url: https://github.com/airspeed-velocity/asv_runner/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 5f0c0cf9206bb69ae43ef20d35bb61ddd822d3b5deac6f3c802f1fb3d02f4d90

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pdm-backend
    - pip
  run:
    - python >={{ python_min }}
    - importlib-metadata

test:
  imports:
    - asv_runner
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://airspeed-velocity.github.io/asv_runner/
  summary: Core Python benchmark code for ASV
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - HaoZeke
