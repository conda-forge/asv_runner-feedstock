{% set name = "asv_runner" %}
{% set version = "0.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # GitHub tag tree for pdm-backend / PDM_BUILD_SCM_VERSION. 0.3.1 also
  # publishes an sdist on PyPI; keep the tag URL so the bot can follow v*.
  url: https://github.com/airspeed-velocity/asv_runner/archive/refs/tags/v{{ version }}.tar.gz
  sha256: bcbb6456ab689192f606dbfaa20f04f0201e643a9f6c6d6fae033cf93b7068e4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  script_env:
    - PDM_BUILD_SCM_VERSION={{ version }}

requirements:
  host:
    - python {{ python_min }}
    - pdm-backend
    - pip
  run:
    - python >={{ python_min }}
    - importlib-metadata

test:
  imports:
    - asv_runner
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://airspeed-velocity.github.io/asv_runner/
  summary: Core Python benchmark code for ASV
  license: BSD-3-Clause
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - HaoZeke
